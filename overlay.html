<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gif This Milk — Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="overlay-mode">
  <div class="overlay-wrap">
    <div class="overlay-card">
      <header class="overlay-header">
        <h1>Gif This Milk</h1>
        <p class="slogan">gif this milk</p>
      </header>

      <div class="milk-machine">
        <div class="machine-body" id="machine">
          <div class="machine-nozzle"></div>
          <div class="milk-stream" id="stream"></div>
        </div>
        <div class="milk-bottle" id="bottle">
          <span class="emoji" id="bottle-emoji">🥛</span>
        </div>
        <div class="milk-fountain" id="fountain"></div>
        <div class="particles" id="particles"></div>
      </div>

      <div class="milk-meter">
        <label>Milch-Level</label>
        <div class="meter-track">
          <div class="meter-fill" id="meter-fill"></div>
        </div>
      </div>

      <div class="event-toast" id="toast">
        <span id="toast-text">Warte auf Milch…</span>
        <div class="gif-tag" id="gif-tag">gif this milk</div>
      </div>

      <div class="leaderboard-mini">
        <strong>Top Melker</strong>
        <ol id="leaderboard"></ol>
      </div>
    </div>
  </div>

  <script type="module" src="js/overlay.js"></script>
</body>
</html>
