<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09090f">
  <title>Gif This Milk — Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="overlay-mode">
  <div class="overlay-wrap">
    <div class="overlay-card" id="overlay-card">
      <header class="overlay-header">
        <h1>Gif This Milk</h1>
        <p class="slogan">gif this milk</p>
      </header>

      <div class="milk-scene">
        <div class="machine-body" id="machine">
          <div class="machine-brand">GTM</div>
          <div class="machine-tank">
            <div class="tank-liquid" id="tank-liquid"></div>
          </div>
          <div class="machine-panel">
            <span class="panel-light"></span>
            <span class="panel-light delay"></span>
            <span class="panel-light delay2"></span>
          </div>
          <div class="machine-nozzle">
            <div class="milk-stream" id="stream"></div>
          </div>
        </div>
        <div class="milk-bottle" id="bottle">
          <div class="bottle-glass">
            <div class="bottle-liquid" id="bottle-liquid"></div>
          </div>
          <span class="emoji" id="bottle-emoji">🥛</span>
        </div>
        <div class="milk-fountain" id="fountain"></div>
        <div class="particles" id="particles"></div>
        <div class="float-layer" id="float-layer"></div>
        <div class="flash" id="flash"></div>
      </div>

      <div class="gif-banner" id="gif-banner">
        <span class="gif-banner-emoji" id="gif-emoji">🥛</span>
        <div class="gif-banner-text">
          <span class="gif-banner-title" id="gif-title">Classic Milk</span>
          <span class="gif-banner-sub" id="gif-sub">gif this milk</span>
        </div>
      </div>

      <div class="milk-meter">
        <label><span>Milch-Level</span><span id="meter-label">0%</span></label>
        <div class="meter-track">
          <div class="meter-fill" id="meter-fill"></div>
        </div>
      </div>

      <div class="event-toast" id="toast">
        <span id="toast-text">Warte auf Milch…</span>
        <div class="gif-tag" id="gif-tag">gif this milk</div>
      </div>

      <div class="leaderboard-mini">
        <strong>Top Melker</strong>
        <ol id="leaderboard"></ol>
      </div>
    </div>
  </div>
  <script type="module" src="js/overlay.js"></script>
</body>
</html>
