<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gif This Milk — OBS Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="sortiment/css/style.css?v=17">
  <link rel="stylesheet" href="css/overlay.css?v=17">
</head>
<body class="obs-overlay">
  <div id="overlay-app" class="overlay-shell">
    <header class="overlay-brand">
      <span>🥛</span>
      <strong>gif this milk</strong>
      <span class="overlay-badge" id="mode-badge">DEMO</span>
    </header>
    <div class="stage overlay-stage">
      <div class="machine">
        <div class="machine-box"><div class="machine-fluid"></div></div>
        <div class="stream" id="pour-stream"></div>
      </div>
      <div class="glass-box">
        <div class="glass" id="glass">
          <div class="glass-milk" id="glass-milk" style="height:0%"></div>
        </div>
        <div class="meter"><div class="meter-fill" id="meter-fill" style="width:0%"></div></div>
        <p class="meter-label" id="meter-label">0%</p>
        <p class="meter-stats" id="meter-stats">❤️ 0 · 🥤 0×</p>
      </div>
    </div>
    <div class="toast show" id="toast">❤️ Like füllt · trinken leert</div>
  </div>
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script type="module" src="js/overlay-live.js?v=17"></script>
</body>
</html>
