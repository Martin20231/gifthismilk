<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#09090f">
  <title>Gif This Milk — Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=3">
</head>
<body class="demo-bg">
  <main class="demo-page">
    <header class="hero">
      <div class="hero-badge"><span class="status-dot" id="status-dot"></span> <span id="status-text">Live-Demo</span></div>
      <h1>Gif This Milk</h1>
      <p class="tagline">gif this milk</p>
    </header>

    <section class="demo-section">
      <h2>Stream-Vorschau</h2>
      <div class="phone-shell">
        <div class="phone-notch"></div>
        <div class="phone-label">TikTok Live</div>
        <div class="overlay-wrap">
          <div class="overlay-card" id="preview-card">
            <header class="overlay-header">
              <h1>Gif This Milk</h1>
              <p class="slogan">gif this milk</p>
            </header>

            <div class="milk-scene">
              <div class="machine-body" id="preview-machine">
                <div class="machine-window">
                  <div class="tank-liquid" id="preview-tank-liquid"></div>
                  <span class="machine-icon" aria-hidden="true">🥛</span>
                </div>
                <div class="machine-label">MILCH-O-MAT</div>
                <div class="machine-panel">
                  <span class="panel-light"></span>
                  <span class="panel-light delay"></span>
                  <span class="panel-light delay2"></span>
                </div>
                <div class="machine-nozzle">
                  <div class="milk-stream" id="preview-stream"></div>
                </div>
              </div>
              <div class="milk-bottle" id="preview-bottle">
                <div class="bottle-glass">
                  <div class="bottle-liquid" id="preview-bottle-liquid"></div>
                </div>
                <span class="emoji" id="preview-bottle-emoji">🥛</span>
              </div>
              <div class="milk-fountain" id="preview-fountain"></div>
              <div class="particles" id="preview-particles"></div>
              <div class="float-layer" id="preview-float-layer"></div>
              <div class="flash" id="preview-flash"></div>
            </div>

            <div class="gif-banner" id="preview-gif-banner" hidden>
              <span class="gif-banner-emoji" id="preview-gif-emoji"></span>
              <div class="gif-banner-text">
                <span class="gif-banner-title" id="preview-gif-title"></span>
                <span class="gif-banner-sub" id="preview-gif-sub"></span>
              </div>
            </div>

            <div class="milk-meter">
              <label><span>Milch-Level</span><span id="preview-meter-label">0%</span></label>
              <div class="meter-track">
                <div class="meter-fill" id="preview-meter-fill"></div>
              </div>
            </div>

            <div class="event-toast visible" id="preview-toast">
              <span id="preview-toast-text">Tippe 🌹 Rose unten</span>
              <div class="gif-tag" id="preview-gif-tag">gif this milk</div>
            </div>

            <div class="leaderboard-mini">
              <strong>Top Melker</strong>
              <ol id="preview-leaderboard"><li>Noch niemand…</li></ol>
            </div>
          </div>
        </div>
      </div>
      <p class="preview-hint">So erscheint es im TikTok-Stream.</p>
    </section>

    <section class="demo-section">
      <h2>Events testen</h2>
      <div class="btn-grid">
        <button class="btn" data-sim="chat">💬 !milch</button>
        <button class="btn" data-sim="like">❤️ Likes</button>
        <button class="btn" data-sim="gift-small">🌹 Rose</button>
        <button class="btn" data-sim="gift-medium">💖 Heart</button>
        <button class="btn" data-sim="gift-large">💎 Universe</button>
        <button class="btn" data-sim="follow">➕ Follow</button>
        <button class="btn btn-primary" data-sim="fountain">🌊 Fontäne</button>
      </div>
    </section>

    <section class="demo-section">
      <h2>Milch-Sammlung</h2>
      <div class="milk-collection" id="milk-collection"></div>
    </section>

    <section class="demo-section link-box">
      <strong>OBS Overlay URL</strong>
      <code id="overlay-url"></code>
    </section>
  </main>
  <script type="module" src="js/demo.js"></script>
</body>
</html>
